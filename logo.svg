<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Ripple Rings -->
  <ellipse cx="150" cy="250" rx="60" ry="15" fill="none" stroke="#00F2FE" stroke-width="4" opacity="0.3"/>
  <ellipse cx="150" cy="250" rx="42" ry="10" fill="none" stroke="#00F2FE" stroke-width="4" opacity="0.6"/>
  <ellipse cx="150" cy="250" rx="22" ry="6" fill="#00F2FE"/>
  
  <!-- Map Pin Body -->
  <path d="M 150 35 C 100 35 65 70 65 120 C 65 170 125 225 150 242 C 175 225 235 170 235 120 C 235 70 200 35 150 35 Z" fill="url(#pinGrad)" filter="url(#glowEffect)"/>
  
  <!-- Concentric Inner Circles -->
  <circle cx="150" cy="115" r="42" fill="none" stroke="#FFFFFF" stroke-width="10"/>
  <circle cx="150" cy="115" r="26" fill="none" stroke="#FFFFFF" stroke-width="5"/>
</svg>